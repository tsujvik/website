<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>andy's journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <linearGradient id="metal" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0a0f2e"/>
      <stop offset="0.14" stop-color="#c9cfe3"/>
      <stop offset="0.22" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#3c4677"/>
      <stop offset="0.38" stop-color="#0a0f2e"/>
      <stop offset="0.5" stop-color="#8a93b0"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="0.66" stop-color="#5b6690"/>
      <stop offset="0.76" stop-color="#141a45"/>
      <stop offset="0.88" stop-color="#e9ecf4"/>
      <stop offset="1" stop-color="#8a93b0"/>
    </linearGradient>
  </svg>

  <main class="scrapbook">
    <div class="container">
      <div class="section-head">
        <div>
          <h1>andy's journal</h1>
          <p class="board-hint">try moving things around!</p>
        </div>
        <div class="board-actions">
          <button class="btn" id="shuffle">Shuffle</button>
          <button class="btn" id="reset">Reset</button>
        </div>
      </div>

      <div class="board">
        <figure class="scrap polaroid taped" style="left: 4%; top: 6%; --r: -6deg" data-mobile="4% 2%">
          <div class="placeholder" style="--hue: 228">Photo</div>
          <figcaption>first hackathon!!</figcaption>
        </figure>

        <div class="scrap sticky" style="left: 26%; top: 10%; --r: 4deg" data-mobile="52% 5%">
          currently learning:<br>Unity + C#
        </div>

        <div class="scrap ticket" style="left: 46%; top: 4%; --r: -2deg" data-mobile="30% 24%">
          <div class="ticket-main">
            <span class="ticket-label">Admit one</span>
            <strong>Jane Street AMP</strong>
            <span>Summer 2026</span>
          </div>
          <div class="ticket-stub">No. 079</div>
        </div>

        <figure class="scrap polaroid taped" style="left: 74%; top: 8%; --r: 7deg" data-mobile="50% 37%">
          <div class="placeholder" style="--hue: 255">Photo</div>
          <figcaption>put something here</figcaption>
        </figure>

        <div class="scrap stamp" style="left: 6%; top: 60%; --r: -8deg" data-mobile="6% 38%">
          <span>Oakland<br>CA</span>
        </div>

        <div class="scrap star" style="left: 23%; top: 58%; --r: 12deg" data-mobile="14% 55%">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 2 L61 38 L98 38 L68 60 L79 96 L50 74 L21 96 L32 60 L2 38 L39 38 Z" fill="url(#metal)" stroke="#0a0f2e" stroke-width="2"/>
          </svg>
        </div>

        <figure class="scrap polaroid taped" style="left: 48%; top: 46%; --r: -4deg" data-mobile="6% 70%">
          <div class="placeholder" style="--hue: 215">Photo</div>
          <figcaption>sketchbook page</figcaption>
        </figure>

        <div class="scrap sticky sticky-alt" style="left: 76%; top: 60%; --r: -5deg" data-mobile="52% 76%">
          text<br>________<br>________
        </div>
      </div>
    </div>
  </main>

</body>
</html>
